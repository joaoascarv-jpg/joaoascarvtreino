<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161A;
    --surface: #1D2027;
    --surface-2: #262A33;
    --border: #33373F;
    --text: #EDEEF0;
    --muted: #8B909B;
    --accent: #FF4B3E;
    --accent-text: #1A0605;
    --lime: #C8FF4D;
    --lime-text: #1A2400;
    --radius: 10px;
    --font-display: 'Archivo Black', 'Arial Black', sans-serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Roboto Mono', 'SF Mono', Consolas, monospace;
  }

  :root:not([data-theme="light"]) { color-scheme: dark; }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F4F4F2; --surface: #FFFFFF; --surface-2: #ECECE9; --border: #DBDBD7;
      --text: #17181B; --muted: #6B6E76; --accent-text: #FFFFFF; --lime-text: #1A2400;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #F4F4F2; --surface: #FFFFFF; --surface-2: #ECECE9; --border: #DBDBD7;
    --text: #17181B; --muted: #6B6E76; --accent-text: #FFFFFF; --lime-text: #1A2400;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { touch-action: manipulation; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: calc(48px + env(safe-area-inset-bottom));
    overscroll-behavior-y: contain;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 14px 8px;
  }

  header.top {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0 14px;
    margin-bottom: 4px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1;
  }
  h1 span { color: var(--accent); }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-mono);
  }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 2px 8px;
    margin-bottom: 14px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    min-height: 40px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab.add-tab { color: var(--accent); border-style: dashed; }

  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .day-header .day-name { font-weight: 700; font-size: 16px; }
  .day-header .day-actions { display: flex; gap: 4px; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-body);
    padding: 8px 6px;
    min-height: 36px;
  }
  .icon-btn:active { color: var(--text); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }

  .ex-row { display: flex; align-items: flex-start; gap: 10px; }

  .check {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bg);
    padding: 0;
  }
  .check.done { background: var(--lime); border-color: var(--lime); color: var(--lime-text); }
  .check svg { width: 14px; height: 14px; display: none; }
  .check.done svg { display: block; }

  .ex-main { flex: 1; min-width: 0; }

  .ex-name { font-weight: 600; font-size: 15px; margin: 0 0 4px; word-break: break-word; }
  .ex-name.done { color: var(--muted); text-decoration: line-through; }

  .ex-meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 13px;
    flex-wrap: wrap;
  }
  .ex-meta .weight { color: var(--accent); font-weight: 700; font-size: 15px; }
  .ex-meta .trend { font-size: 11px; }
  .ex-meta .trend.up { color: var(--lime); }
  .ex-meta .trend.down { color: var(--accent); }

  .ex-controls { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .ex-controls button {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font-body);
    min-height: 30px;
    white-space: nowrap;
  }
  .ex-controls button:active { color: var(--text); }

  .edit-form {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .edit-form .name-field { grid-column: 1 / -1; }
  .edit-form .save-row { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 2px; }

  .progress-panel {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .progress-panel .chart-wrap {
    width: 100%;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-panel svg { width: 100%; height: auto; display: block; }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 7px 10px;
  }
  .history-row .h-weight { color: var(--text); font-weight: 700; }
  .history-row button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .no-history { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 0; }
  .log-now-row { display: flex; gap: 8px; margin-top: 8px; }
  .log-now-row input { flex: 1; }

  input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px 10px;
    font-size: 16px;
    font-family: var(--font-body);
    width: 100%;
    min-height: 40px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder { color: var(--muted); }

  .btn {
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: var(--font-body);
    min-height: 40px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .add-ex {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius);
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
    min-height: 46px;
  }
  .add-ex:active { color: var(--accent); border-color: var(--accent); }

  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty p { margin: 0 0 12px; font-size: 14px; }

  .new-day-form { display: flex; gap: 8px; margin-bottom: 16px; }
  .new-day-form input { flex: 1; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-family: var(--font-mono);
    margin-top: 24px;
    padding: 0 16px calc(8px + env(safe-area-inset-bottom));
  }

  @media (min-width: 420px) {
    .ex-controls { flex-direction: row; }
  }

  .view-switch {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    margin-bottom: 16px;
  }
  .view-switch button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    font-size: 13px;
    padding: 9px 0;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
    min-height: 38px;
  }
  .view-switch button.active { background: var(--text); color: var(--bg); }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-header .cal-month {
    font-weight: 700;
    font-size: 16px;
    text-transform: capitalize;
  }
  .cal-nav {
    display: flex;
    gap: 4px;
  }
  .cal-nav button {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .cal-weekdays span {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    position: relative;
    padding: 0;
  }
  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-day.today { border-color: var(--text); border-width: 2px; }
  .cal-day.planned { border-color: var(--accent); border-width: 2px; color: var(--accent); }
  .cal-day.done { background: var(--lime); border-color: var(--lime); color: var(--lime-text); }

  .cal-legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .cal-legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .dot.planned { background: transparent; border: 2px solid var(--accent); }
  .dot.done { background: var(--lime); }

  .cal-stats {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
  }
  .cal-stats b { color: var(--text); }

  .chart-card { padding: 18px 14px; }
  .chart-title { font-weight: 700; font-size: 15px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; text-transform: capitalize;}
  .chart-title .badge { background: var(--surface-2); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-family: var(--font-mono); color: var(--muted); font-weight: 500; text-transform: none;}
  .chart-wrap-big { width: 100%; margin-bottom: 8px; }
  .chart-wrap-big svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-stats-row { display: flex; justify-content: space-between; margin-top: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 12px;}
  .chart-stats-row b { color: var(--text); font-size: 14px; }

  .finish-btn {
    width: 100%;
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: var(--font-body);
    margin-bottom: 14px;
    min-height: 48px;
    background: var(--accent);
    color: var(--accent-text);
  }
  .finish-btn.finished {
    background: var(--lime);
    color: var(--lime-text);
  }

  .sync-status {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .sync-status.ok { color: var(--lime); }
  .sync-status.err { color: var(--accent); }
  .sync-code-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .sync-code-row input { font-family: var(--font-mono); font-size: 13px; }
  .sync-divider {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin: 12px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>TR<span>EI</span>NO</h1>
    <div style="display:flex; gap:8px;">
      <button class="theme-toggle" id="syncToggle" title="Sincronizar entre aparelhos">🔗</button>
      <button class="theme-toggle" id="themeToggle">◐</button>
    </div>
  </header>

  <div id="syncPanel" class="card" style="display:none; margin-bottom:16px;"></div>

  <div class="view-switch" id="viewSwitch">
    <button data-view="workouts" class="active">treinos</button>
    <button data-view="calendar">calendário</button>
    <button data-view="charts">evolução</button>
  </div>

  <div id="workoutsView">
    <!-- Datalist invisível para armazenar os exercícios conhecidos -->
    <datalist id="exerciseList"></datalist>

    <div id="tabs" class="tabs"></div>
    <div id="newDayForm" class="new-day-form" style="display:none;">
      <input type="text" id="newDayName" placeholder="Nome do dia (ex: Peito, Costas...)" maxlength="24">
      <button class="btn btn-primary" id="confirmNewDay">Criar</button>
      <button class="btn btn-ghost" id="cancelNewDay">×</button>
    </div>

    <div id="dayHeader" class="day-header"></div>
    <div id="finishWorkoutWrap"></div>
    <div id="exList"></div>
    <button class="add-ex" id="addExBtn">+ adicionar exercício</button>

    <div id="emptyState" class="empty" style="display:none;">
      <p>Nenhum dia de treino ainda.<br>Crie o primeiro pra começar a registrar.</p>
    </div>
  </div>

  <div id="calendarView" style="display:none;">
    <div class="cal-header">
      <div class="cal-nav"><button id="calPrev">‹</button></div>
      <div class="cal-month" id="calMonthLabel"></div>
      <div class="cal-nav"><button id="calNext">›</button></div>
    </div>
    <div class="cal-weekdays">
      <span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span><span class="dot planned"></span>planejado</span>
      <span><span class="dot done"></span>treinado</span>
    </div>
    <div class="cal-stats" id="calStats"></div>
  </div>

  <div id="chartsView" style="display:none;">
    <div id="chartsList"></div>
  </div>

  <footer>salvo neste dispositivo · seus dados não saem daqui</footer>
</div>

<script>
(function () {
  // --- CONFIGURAÇÃO PWA (Instalação no Celular/Chrome) ---
  function initPWA() {
    var manifest = {
      name: "Treino App",
      short_name: "Treino",
      start_url: window.location.pathname,
      display: "standalone",
      background_color: "#14161A",
      theme_color: "#14161A",
      icons: [{
        src: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiB2aWV3Qm94PSIwIDAgNTEyIDUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIHJ4PSIxMDAiIGZpbGw9IiMxNDE2MUEiLz48dGV4dCB4PSIyNTYiIHk9IjI3NiIgZm9udC1zaXplPSIyMDAiIGZpbGw9IiNGRjRCM0UiIGZvbnQtZmFtaWx5PSJBcmlhbCBCbGFjayIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+VFI8L3RleHQ+PC9zdmc+',
        sizes: '512x512',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }]
    };
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      var swCode = "self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => self.clients.claim()); self.addEventListener('fetch', e => {});";
      var blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
    }
  }
  initPWA();

  var STORAGE_KEY = 'treino_data_v1';
  var THEME_KEY = 'treino_theme_v1';
  var SYNC_ID_KEY = 'treino_sync_id';
  var JSONBIN_KEY = '$2a$10$0UCvlRJVI/3WA5su5RBZQe69Y2WdtfC/j1s3crJ6U4G.OjmGkecli';
  var JSONBIN_ROOT = 'https://api.jsonbin.io/v3/b';
  var syncId = null;
  var syncPushTimer = null;
  var syncBusy = false;
  var state = { days: [], activeDayId: null, calendar: {} };
  var openPanels = {}; 
  var currentView = 'workouts';
  var calCursor = new Date(); calCursor.setDate(1);
  var MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(iso) {
    var p = iso.split('-');
    return p[2] + '/' + p[1];
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.days)) {
          parsed.days.forEach(function (d) {
            d.exercises.forEach(function (e) { if (!Array.isArray(e.history)) e.history = []; });
          });
          if (!parsed.calendar || typeof parsed.calendar !== 'object') parsed.calendar = {};
          state = parsed;
          return;
        }
      }
    } catch (e) { }
    state = { days: [], activeDayId: null, calendar: {} };
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { }
    scheduleSyncPush();
  }

  function loadSyncId() {
    try { syncId = localStorage.getItem(SYNC_ID_KEY) || null; }
    catch (e) { syncId = null; }
  }

  function setSyncId(id) {
    syncId = id;
    try {
      if (id) localStorage.setItem(SYNC_ID_KEY, id);
      else localStorage.removeItem(SYNC_ID_KEY);
    } catch (e) {}
  }

  function scheduleSyncPush() {
    if (!syncId) return;
    if (syncPushTimer) clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(pushRemote, 1200);
  }

  function jsonbinHeaders() {
    return { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY };
  }

  function pushRemote() {
    if (!syncId) return;
    syncBusy = true; renderSyncPanel();
    fetch(JSONBIN_ROOT + '/' + syncId, {
      method: 'PUT',
      headers: Object.assign(jsonbinHeaders(), { 'X-Bin-Versioning': 'false' }),
      body: JSON.stringify(state)
    }).then(async function (res) {
      if (!res.ok) {
        var errText = await res.text();
        throw new Error('push failed with status: ' + res.status + ' - ' + errText);
      }
      syncBusy = false; renderSyncPanel();
    }).catch(function (err) {
      console.error('Erro no pushRemote:', err);
      var msg = 'Falha ao salvar na nuvem.';
      if (err.message.includes('401')) msg = 'API Key inválida (Erro 401).';
      syncBusy = false; renderSyncPanel('err', msg);
    });
  }

  function fetchRemote(id) {
    return fetch(JSONBIN_ROOT + '/' + id, { headers: jsonbinHeaders() })
      .then(async function (res) {
        if (!res.ok) {
          var errText = await res.text();
          throw new Error('fetch failed with status: ' + res.status + ' - ' + errText);
        }
        return res.json();
      })
      .then(function (json) { return json && json.record ? json.record : null; });
  }

  function createSyncBin() {
    syncBusy = true; renderSyncPanel();
    return fetch(JSONBIN_ROOT, {
      method: 'POST',
      headers: Object.assign(jsonbinHeaders(), { 
        'X-Bin-Private': 'true', 
        'X-Bin-Name': 'treino-app',
        'X-Bin-Versioning': 'false'
      }),
      body: JSON.stringify(state)
    }).then(async function (res) {
      if (!res.ok) {
        var errText = await res.text();
        throw new Error('create failed with status: ' + res.status + ' - ' + errText);
      }
      return res.json();
    }).then(function (json) {
      var id = json.metadata.id;
      setSyncId(id);
      syncBusy = false; renderSyncPanel('ok');
    }).catch(function (err) {
      console.error('Erro no createSyncBin:', err);
      var msg = 'Erro ao criar chave.';
      if (err.message.includes('401')) {
        msg = 'Erro 401: A chave (Master Key) inserida no código é inválida.';
      }
      syncBusy = false; renderSyncPanel('err', msg);
    });
  }

  function connectSyncBin(id) {
    syncBusy = true; renderSyncPanel();
    return fetchRemote(id).then(function (record) {
      if (!record || !Array.isArray(record.days)) throw new Error('Dados inválidos recebidos');
      state = record;
      if (!state.calendar) state.calendar = {};
      state.days.forEach(function (d) {
        d.exercises.forEach(function (e) { if (!Array.isArray(e.history)) e.history = []; });
      });
      setSyncId(id);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      syncBusy = false; renderSyncPanel('ok');
      renderAll();
    }).catch(function (err) {
      console.error('Erro no connectSyncBin:', err);
      var msg = 'Código inválido ou erro de conexão.';
      if (err.message.includes('401')) msg = 'Erro 401: A chave (Master Key) inserida no código é inválida.';
      syncBusy = false; renderSyncPanel('err', msg);
    });
  }

  function disconnectSync() {
    setSyncId(null);
    renderSyncPanel();
  }

  function renderSyncPanel(flash, flashMsg) {
    var panel = document.getElementById('syncPanel');
    var statusHtml = '';
    if (syncBusy) {
      statusHtml = '<div class="sync-status">sincronizando…</div>';
    } else if (flash === 'ok') {
      statusHtml = '<div class="sync-status ok">✓ sincronizado</div>';
    } else if (flash === 'err') {
      statusHtml = '<div class="sync-status err">' + esc(flashMsg || 'falha ao sincronizar, tente de novo') + '</div>';
    }

    if (syncId) {
      panel.innerHTML =
        statusHtml +
        '<div class="sync-status">este aparelho está sincronizado. use o código abaixo no outro aparelho:</div>' +
        '<div class="sync-code-row">' +
          '<input type="text" id="syncCodeDisplay" value="' + esc(syncId) + '" readonly>' +
          '<button class="btn btn-ghost" id="copySyncCode">copiar</button>' +
        '</div>' +
        '<button class="btn btn-ghost" id="disconnectSyncBtn">desconectar este aparelho</button>';
      var copyBtn = document.getElementById('copySyncCode');
      if (copyBtn) copyBtn.onclick = function () {
        var input = document.getElementById('syncCodeDisplay');
        input.select();
        try { navigator.clipboard.writeText(syncId); } catch (e) { document.execCommand('copy'); }
        copyBtn.textContent = 'copiado!';
        setTimeout(function () { copyBtn.textContent = 'copiar'; }, 1500);
      };
      var discBtn = document.getElementById('disconnectSyncBtn');
      if (discBtn) discBtn.onclick = disconnectSync;
    } else {
      panel.innerHTML =
        statusHtml +
        '<div class="sync-status">nenhuma sincronização ativa neste aparelho.</div>' +
        '<button class="btn btn-primary" id="createSyncBtn" style="width:100%; margin-bottom:4px;">criar código de sincronização</button>' +
        '<div class="sync-divider">ou entre com um código existente</div>' +
        '<div class="sync-code-row">' +
          '<input type="text" id="syncCodeInput" placeholder="cole o código aqui">' +
          '<button class="btn btn-ghost" id="connectSyncBtn">conectar</button>' +
        '</div>';
      var createBtn = document.getElementById('createSyncBtn');
      if (createBtn) createBtn.onclick = createSyncBin;
      var connectBtn = document.getElementById('connectSyncBtn');
      if (connectBtn) connectBtn.onclick = function () {
        var val = document.getElementById('syncCodeInput').value.trim();
        if (val) connectSyncBin(val);
      };
    }
  }

  function loadTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  }
  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }

  function activeDay() { return state.days.find(function (d) { return d.id === state.activeDayId; }); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function logEntry(ex, dateIso, weight, reps, sets) {
    var existing = ex.history.find(function (h) { return h.date === dateIso; });
    if (existing) {
      existing.weight = weight; existing.reps = reps; existing.sets = sets;
    } else {
      ex.history.push({ date: dateIso, weight: weight, reps: reps, sets: sets });
    }
    ex.history.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }

  function removeEntry(ex, dateIso) {
    ex.history = ex.history.filter(function (h) { return h.date !== dateIso; });
  }

  function trendBadge(ex) {
    if (ex.history.length < 2) return '';
    var last = parseFloat(ex.history[ex.history.length - 1].weight);
    var prev = parseFloat(ex.history[ex.history.length - 2].weight);
    if (isNaN(last) || isNaN(prev) || last === prev) return '';
    var diff = last - prev;
    var cls = diff > 0 ? 'up' : 'down';
    var arrow = diff > 0 ? '▲' : '▼';
    return '<span class="trend ' + cls + '">' + arrow + ' ' + Math.abs(diff) + 'kg</span>';
  }

  function sparklineSvg(history) {
    if (!history.length) return '';
    var w = 280, h = 70, pad = 8;
    var weights = history.map(function (h) { return parseFloat(h.weight) || 0; });
    var min = Math.min.apply(null, weights);
    var max = Math.max.apply(null, weights);
    if (min === max) { min -= 1; max += 1; }
    var n = history.length;
    var stepX = n > 1 ? (w - pad * 2) / (n - 1) : 0;
    var points = weights.map(function (val, i) {
      var x = pad + stepX * i;
      var y = h - pad - ((val - min) / (max - min)) * (h - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var dots = weights.map(function (val, i) {
      var x = pad + stepX * i;
      var y = h - pad - ((val - min) / (max - min)) * (h - pad * 2);
      return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="var(--accent)" />';
    }).join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + points.join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />' +
      dots + '</svg>';
  }

    addBtn.textContent = '+ dia';
    addBtn.onclick = function () {

  function renderFinishButton() {
    var wrap = document.getElementById('finishWorkoutWrap');
    var day = activeDay();
    if (!day) { wrap.innerHTML = ''; return; }
    var todayIso = todayStr();
    var isFinished = state.calendar[todayIso] === 'done';
    var btn = document.createElement('button');
    btn.className = 'finish-btn' + (isFinished ? ' finished' : '');
    btn.textContent = isFinished ? '✓ treino de hoje registrado' : 'finalizar treino de hoje';
    btn.onclick = function () {
      if (state.calendar[todayIso] === 'done') delete state.calendar[todayIso];

    var el = document.getElementById('dayHeader');
    var day = activeDay();

    el.innerHTML =
      '<span class="day-name">' + esc(day.name) + '</span>' +
      '<span class="day-actions">' +
        '<button class="icon-btn" id="dupDayBtn">duplicar</button>' +
        '<button class="icon-btn" id="resetDoneBtn">desmarcar tudo</button>' +
        '<button class="icon-btn" id="deleteDayBtn">excluir dia</button>' +
      '</span>';
      
    var dupBtn = document.getElementById('dupDayBtn');

            id: uid(), // Novo ID pra não bugar nada

  function exerciseCard(day, ex) {
    var card = document.createElement('div');
    card.className = 'card';

    var row = document.createElement('div');
    row.className = 'ex-row';

    var check = document.createElement('button');
    check.className = 'check' + (ex.done ? ' done' : '');
    check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    check.onclick = function () {
      ex.done = !ex.done;
      if (ex.done) {
        logEntry(ex, todayStr(), ex.weight || '0', ex.sets || '', ex.reps || '');
      } else {
        removeEntry(ex, todayStr());
      }
      save(); renderExList();
    };

    var main = document.createElement('div');
    main.className = 'ex-main';

    var name = document.createElement('p');
    name.className = 'ex-name' + (ex.done ? ' done' : '');
    name.textContent = ex.name;

    var meta = document.createElement('div');
    meta.className = 'ex-meta';
    var setsReps = (ex.sets || '?') + 'x' + (ex.reps || '?');
    meta.innerHTML = '<span>' + esc(setsReps) + '</span><span class="weight">' + esc(ex.weight || '0') + ' kg</span>' + trendBadge(ex);

    main.appendChild(meta);
    if (ex.notes) {

      main.appendChild(notes);

    var controls = document.createElement('div');
    controls.className = 'ex-controls';
    var progressBtn = document.createElement('button');
    progressBtn.textContent = 'progresso' + (ex.history.length ? ' (' + ex.history.length + ')' : '');
    var editBtn = document.createElement('button');
    editBtn.textContent = 'editar';
    var delBtn = document.createElement('button');
    delBtn.textContent = 'excluir';
    delBtn.onclick = function () {
      day.exercises = day.exercises.filter(function (e) { return e.id !== ex.id; });
      save(); renderExList();
    };
    controls.appendChild(progressBtn);
    controls.appendChild(editBtn);
    controls.appendChild(delBtn);

    row.appendChild(check);
    row.appendChild(main);
    row.appendChild(controls);
    card.appendChild(row);

    // Edit Panel
    var editWrap = document.createElement('div');
    editWrap.className = 'edit-form';
    editWrap.style.display = openPanels[ex.id] === 'edit' ? 'grid' : 'none';
    editWrap.innerHTML =
      '<input class="name-field" data-f="name" list="exerciseList" placeholder="Exercício" value="' + esc(ex.name) + '">' +
      '<input data-f="sets" placeholder="Séries" value="' + esc(ex.sets || '') + '">' +
      '<input data-f="reps" placeholder="Reps" value="' + esc(ex.reps || '') + '">' +
      '<input data-f="weight" placeholder="Peso (kg)" value="' + esc(ex.weight || '') + '">' +
      '<div class="save-row"><button class="btn btn-primary" data-action="save">salvar</button></div>';
    card.appendChild(editWrap);
    
    editBtn.onclick = function () {
      openPanels[ex.id] = openPanels[ex.id] === 'edit' ? null : 'edit';
      renderExList();
    };

    // Auto-completar Inteligente
    var nameInput = editWrap.querySelector('[data-f="name"]');
    if (nameInput) {
      nameInput.addEventListener('change', function(e) {
        var selectedName = e.target.value.trim().toLowerCase();
        var found = null;
        state.days.forEach(function(d) {
          d.exercises.forEach(function(existingEx) {
            if (existingEx.name.trim().toLowerCase() === selectedName && existingEx.id !== ex.id) {
              found = existingEx;
            }
          });
        });
        
        if (found) {
          var setsInput = editWrap.querySelector('[data-f="sets"]');
          var repsInput = editWrap.querySelector('[data-f="reps"]');
          var weightInput = editWrap.querySelector('[data-f="weight"]');
          
          if (setsInput && (!setsInput.value || setsInput.value === '3')) setsInput.value = found.sets || '';
          if (repsInput && (!repsInput.value || repsInput.value === '10')) repsInput.value = found.reps || '';
          if (weightInput && (!weightInput.value || weightInput.value === '0')) weightInput.value = found.weight || '';
        }
      });
    }

    var saveBtn = editWrap.querySelector('[data-action="save"]');
    if (saveBtn) saveBtn.onclick = function () {
      ex.name = editWrap.querySelector('[data-f="name"]').value.trim() || ex.name;
      ex.sets = editWrap.querySelector('[data-f="sets"]').value.trim();
      ex.reps = editWrap.querySelector('[data-f="reps"]').value.trim();
      ex.weight = editWrap.querySelector('[data-f="weight"]').value.trim();
      openPanels[ex.id] = null;
      save(); renderAll(); // Chama renderAll para atualizar também o datalist
    };

    // Progress Panel
    var progWrap = document.createElement('div');
    progWrap.className = 'progress-panel';
    progWrap.style.display = openPanels[ex.id] === 'progress' ? 'block' : 'none';
    var chartHtml = ex.history.length >= 2
      ? '<div class="chart-wrap">' + sparklineSvg(ex.history) + '</div>'
      : '';
    var historyRows = ex.history.slice().reverse().map(function (h) {
      return '<div class="history-row" data-date="' + esc(h.date) + '">' +
        '<span>' + esc(fmtDate(h.date)) + '</span>' +
        '<span class="h-weight">' + esc(h.weight) + ' kg</span>' +
        '<button data-del="' + esc(h.date) + '">×</button>' +
        '</div>';
    }).join('');
    progWrap.innerHTML = chartHtml +
      '<div class="history-list">' + (historyRows || '<div class="no-history">Nenhum registro ainda. Marque o exercício como feito, ou registre manualmente abaixo.</div>') + '</div>' +
      '<div class="log-now-row">' +
        '<input type="text" data-f="logweight" placeholder="Registrar peso de hoje (kg)">' +
        '<button class="btn btn-ghost" data-action="logtoday">registrar</button>' +
      '</div>';

    progressBtn.onclick = function () {
      openPanels[ex.id] = openPanels[ex.id] === 'progress' ? null : 'progress';
      renderExList();
    };
    progWrap.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.onclick = function () {
        removeEntry(ex, btn.getAttribute('data-del'));
        if (ex.history.every(function (h) { return h.date !== todayStr(); })) ex.done = ex.history.some(function(h){return h.date === todayStr();});
        save(); renderExList();
      };
    });
    var logBtn = progWrap.querySelector('[data-action="logtoday"]');
    if (logBtn) logBtn.onclick = function () {
      var val = progWrap.querySelector('[data-f="logweight"]').value.trim();
      if (!val) return;
      logEntry(ex, todayStr(), val, ex.sets || '', ex.reps || '');
      ex.weight = val;
      ex.done = true;
      save(); renderExList();
    };

    return card;
  }

  function isoDate(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function cycleCalDay(iso) {
    var cur = state.calendar[iso];
    if (!cur) state.calendar[iso] = 'planned';
    else if (cur === 'planned') state.calendar[iso] = 'done';
    else delete state.calendar[iso];
    save(); renderCalendar();
  }

  function renderCalendar() {
    var y = calCursor.getFullYear(), m = calCursor.getMonth();
    document.getElementById('calMonthLabel').textContent = MONTH_NAMES[m] + ' de ' + y;
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    var firstWeekday = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var todayIso = todayStr();

    for (var i = 0; i < firstWeekday; i++) {
      var empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }
    var plannedCount = 0, doneCount = 0;
    for (var day = 1; day <= daysInMonth; day++) {
      var iso = isoDate(y, m, day);
      var status = state.calendar[iso];
      if (status === 'planned') plannedCount++;
      if (status === 'done') doneCount++;
      var cell = document.createElement('button');
      cell.className = 'cal-day' + (status ? ' ' + status : '') + (iso === todayIso ? ' today' : '');
      cell.textContent = day;
      cell.onclick = function (isoVal) { return function () { cycleCalDay(isoVal); }; }(iso);
      grid.appendChild(cell);
    }
    document.getElementById('calStats').innerHTML =
      'este mês: <b>' + doneCount + '</b> treinado' + (doneCount === 1 ? '' : 's') +
      ' · <b>' + plannedCount + '</b> planejado' + (plannedCount === 1 ? '' : 's');
  }

  function buildBigChartSvg(data) {
    var w = 320, h = 140, padTop = 10, padBottom = 20, padLeft = 25, padRight = 10;
    var weights = data.map(function (d) { return d.weight; });
    var min = Math.min.apply(null, weights);
    var max = Math.max.apply(null, weights);
    if (min === max) { min -= 5; max += 5; }
    var diff = max - min;
    min = Math.max(0, min - diff * 0.2); 
    max = max + diff * 0.1;

    var n = data.length;
    var stepX = n > 1 ? (w - padLeft - padRight) / (n - 1) : 0;
    
    var points = data.map(function (d, i) {
      var x = padLeft + stepX * i;
      var y = h - padBottom - ((d.weight - min) / (max - min)) * (h - padBottom - padTop);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });

    var grid = '';
    var numLines = 4;
    for (var i = 0; i < numLines; i++) {
       var val = min + (max - min) * (i / (numLines - 1));
       var y = h - padBottom - ((val - min) / (max - min)) * (h - padBottom - padTop);
       grid += '<line x1="'+padLeft+'" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="var(--border)" stroke-dasharray="4" />';
       grid += '<text x="'+(padLeft-6)+'" y="'+(y+4)+'" fill="var(--muted)" font-size="10" text-anchor="end" font-family="var(--font-mono)">' + Math.round(val) + '</text>';
    }

    var dots = data.map(function (d, i) {
      var x = padLeft + stepX * i;
      var y = h - padBottom - ((d.weight - min) / (max - min)) * (h - padBottom - padTop);
      var dateLabel = '';
      if (i === 0 || i === n - 1) {
         dateLabel = '<text x="'+x+'" y="'+(h - 4)+'" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="var(--font-mono)">' + fmtDate(d.date) + '</text>';
      }
      return dateLabel + '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" fill="var(--bg)" stroke="var(--accent)" stroke-width="2" />';
    }).join('');

    return '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      grid +
      '<polyline points="' + points.join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />' +
      dots + '</svg>';
  }

  function renderChartsView() {
    var list = document.getElementById('chartsList');
    list.innerHTML = '';
    var exMap = {};
    
    state.days.forEach(function(d) {
      d.exercises.forEach(function(e) {
        if (!e.history || e.history.length === 0) return;
        var key = e.name.trim().toLowerCase();
        if (!exMap[key]) exMap[key] = { name: e.name.trim(), history: [] };
        exMap[key].history = exMap[key].history.concat(e.history);
      });
    });

    var keys = Object.keys(exMap);
    if (keys.length === 0) {
      list.innerHTML = '<div class="empty"><p>Nenhum histórico de treino encontrado.<br>Marque seus exercícios como feitos para ver sua evolução.</p></div>';
      return;
    }

    var renderedCount = 0;
    keys.forEach(function(k) {
      var data = exMap[k];
      data.history.sort(function(a, b) { return a.date < b.date ? -1 : 1; });
      
      var dedup = [];
      var lastDate = null;
      data.history.forEach(function(h) {
        if (h.date !== lastDate) {
          dedup.push({ date: h.date, weight: parseFloat(h.weight)||0 });
          lastDate = h.date;
        } else {
          var current = dedup[dedup.length - 1];
          var w = parseFloat(h.weight)||0;
          if (w > current.weight) current.weight = w;
        }
      });

      if (dedup.length < 2) return; 

      renderedCount++;
      var lastW = dedup[dedup.length - 1].weight;
      var maxW = Math.max.apply(null, dedup.map(function(d){ return d.weight; }));
      var gain = lastW - dedup[0].weight;
      var gainStr = gain > 0 ? '<span style="color:var(--lime)">+' + gain + 'kg</span>' : (gain < 0 ? '<span style="color:var(--accent)">' + gain + 'kg</span>' : '0kg');

      var card = document.createElement('div');
      card.className = 'card chart-card';
      card.innerHTML = 
        '<div class="chart-title"><span>' + esc(data.name) + '</span> <span class="badge">' + dedup.length + ' treinos</span></div>' +
        '<div class="chart-wrap-big">' + buildBigChartSvg(dedup) + '</div>' +
        '<div class="chart-stats-row">' +
          '<span>Atual: <b>' + lastW + 'kg</b> (' + gainStr + ')</span>' +
          '<span>Máx: <b>' + maxW + 'kg</b></span>' +
        '</div>';
      list.appendChild(card);
    });
    
    if (renderedCount === 0) {
      list.innerHTML = '<div class="empty"><p>Continue treinando!<br>Os gráficos aparecerão quando houver 2 ou mais registros de peso no mesmo exercício.</p></div>';
    }
  }

  function setView(view) {
    currentView = view;
    document.getElementById('workoutsView').style.display = view === 'workouts' ? 'block' : 'none';
    document.getElementById('calendarView').style.display = view === 'calendar' ? 'block' : 'none';
    document.getElementById('chartsView').style.display = view === 'charts' ? 'block' : 'none';
    document.querySelectorAll('#viewSwitch button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === view);
    });
    if (view === 'calendar') renderCalendar();
    if (view === 'charts') renderChartsView();
  }

  document.getElementById('viewSwitch').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-view]');
    if (btn) setView(btn.getAttribute('data-view'));
  });
  
  document.getElementById('calPrev').onclick = function () {
    calCursor.setMonth(calCursor.getMonth() - 1); renderCalendar();
  };
  document.getElementById('calNext').onclick = function () {
    calCursor.setMonth(calCursor.getMonth() + 1); renderCalendar();
  };

  function renderAll() { 
    renderTabs(); 
    updateExerciseDatalist(); 
    renderExList(); 
  }

  document.getElementById('confirmNewDay').onclick = function () {
    var input = document.getElementById('newDayName');
    var name = input.value.trim();
    if (!name) return;
    var d = { id: uid(), name: name, exercises: [] };
    state.days.push(d);
    state.activeDayId = d.id;
    input.value = '';
    document.getElementById('newDayForm').style.display = 'none';
    save(); renderAll();
  };
  
  document.getElementById('cancelNewDay').onclick = function () {
    document.getElementById('newDayForm').style.display = 'none';
  };
  
  document.getElementById('newDayName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('confirmNewDay').click();
  });

  document.getElementById('addExBtn').onclick = function () {
    var day = activeDay();
    if (!day) return;
    var newEx = { id: uid(), name: 'Novo exercício', sets: '3', reps: '10', weight: '0', notes: '', done: false, history: [] };
    day.exercises.push(newEx);
    openPanels[newEx.id] = 'edit';
    save(); renderAll(); // Usa renderAll para atualizar o datalist também
    var input = document.querySelector('.card:last-child [data-f="name"]');
    if (input) { input.focus(); input.select(); }
  };

  document.getElementById('themeToggle').onclick = toggleTheme;
  document.getElementById('syncToggle').onclick = function () {
    var panel = document.getElementById('syncPanel');
    var show = panel.style.display === 'none';
    panel.style.display = show ? 'block' : 'none';
    if (show) renderSyncPanel();
  };

  load();
  loadTheme();
  loadSyncId();
  if (!state.activeDayId && state.days.length) state.activeDayId = state.days[0].id;
  renderAll();
  
  if (syncId) {
    fetchRemote(syncId).then(function (record) {
      if (record && Array.isArray(record.days)) {
        state = record;
        if (!state.calendar) state.calendar = {};
        state.days.forEach(function (d) {
          d.exercises.forEach(function (e) { if (!Array.isArray(e.history)) e.history = []; });
        });
        if (!state.activeDayId && state.days.length) state.activeDayId = state.days[0].id;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        renderAll();
      }
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
